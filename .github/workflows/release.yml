name: release
on:
  push:
    tags:
      - "v*"
jobs:
  pypi:
    runs-on: ubuntu-22.04
    name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: check version matches tag
        run: |
          VERSION=$(grep "__version__" tensorcircuit/__init__.py | sed -E 's/__version__ = "([^"]+)"/\1/')
          echo "Package version: $VERSION, tag: $GITHUB_REF_NAME"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: setup build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: upload to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
