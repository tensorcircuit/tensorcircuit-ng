title: "A Quantum Approximate Optimization Algorithm"
arxiv_id: "1411.4028"
url: "https://arxiv.org/abs/1411.4028"
year: 2014
authors:
  - "Edward Farhi"
  - "Jeffrey Goldstone"
  - "Sam Gutmann"
tags:
  - "combinatorial-optimization"
  - "quantum-algorithm"
  - "variational-algorithm"
tc_features:
  - "circuit"
  - "jit"
  - "autodiff"
  - "expectation"
backend: "jax"
hardware_requirements:
  gpu: false
  min_memory: "2GB"
card_title: "Section IV · QAOA on a ring of disagrees"
contributor: "refraction-ray"
summary: "TensorCircuit QAOA improves the expected MaxCut ratio on an even ring toward the analytic (2p+1)/(2p+2) curve."
description: "Reproduces the ring-of-disagrees result from Section IV of the original QAOA paper. The even ring is represented by an exact 12-qubit statevector, and the two angles per layer are optimized by TensorCircuit autodiff with JAX. The original result is an asymptotic statement for n larger than the light cone; p=1,2,3,4 and n=12 are used here so the trend is visible on a laptop."
outputs:
  - target: "Section IV: optimized approximation ratio versus QAOA depth"
    path: "outputs/result.png"
    script: "main.py"
