hardware_requirements:
  gpu: false
  min_memory: "4 GB (recommended)"
card_title: "Figure 1 · W-state tomography"
summary: "Finite-shot RBMs recover W-state populations and learn relative phases from Z, XX, and XY measurements."
description: >-
  Illustrates the Figure 1 mechanisms at 8, 10, and 12 qubits with three seeds
  per size. TensorCircuit-NG generates finite-shot samples from positive or
  random-phase W states. Positive-state fits use five nested Z-basis sample
  budgets. Phase fits use 6,400 shots per basis in Z and adjacent XX and XY
  bases, with a matched Z-only control. The RBMs have no support mask. Full
  configuration enumeration replaces Monte Carlo normalization, and L-BFGS-B
  with measured-probability phase pretraining replaces the paper's training
  optimizer. Saved parameters support a separate NumPy check of fidelity,
  leakage, relative phases, and the controls.
outputs:
  - target: "Figure 1 mechanisms: overlap, populations, and measurement-basis comparison"
    path: outputs/result.png
    script: main.py
  - target: "Figure 1 mechanism: relative-phase reconstruction"
    path: outputs/phases.png
    script: main.py
  - target: "Fixed-grid metrics and acceptance checks"
    path: outputs/metrics.json
    script: main.py
  - target: "Simulated measurements and fitted parameters"
    path: outputs/raw_data.npz
    script: main.py
