title: "Real-Time Dynamics in Two Dimensions with Tensor Network States via Time-Dependent Variational Monte Carlo Method"
arxiv_id: "2512.06768"
url: "https://arxiv.org/abs/2512.06768"
year: 2026
authors:
  - "Yantao Wu"
  - "Jannes Nys"
tags:
  - "topological-phase"
  - "many-body-physics"
  - "classical-simulation"
  - "tensor-network"
tc_features:
  - "fermionic-gaussian-state"
  - "jit"
  - "vmap"
  - "scan"
  - "autodiff"
  - "contractor"
backend: "jax"
hardware_requirements:
  gpu: true
  min_memory: "64GB"
card_title: "Figure 2 · 6 x 6 PEPS versus exact dynamics"
summary: "Independent PEPS-tVMC and Gaussian densities share one color scale for a 6 x 6 corner quench."
description: >-
  Reproduces published Figure 2(a) of PRX Quantum 7, 033035 (2026), DOI
  10.1103/tggc-8fjx, with FGSSimulator on the original 12 x 12 open Hofstadter
  lattice. The main PEPS comparison scales the Figure 2(b,c) method to
  6 x 6 sites, 24 particles and D=4, with independent imaginary-time VMC
  preparation and real-time SR/RK4 evolution to t=8 using cached exact
  single-layer PEPS contractions. The Gaussian solution
  supplies no training loss or parameter updates. Independent Gaussian Born
  proposals and exact single-layer PEPS amplitudes give raw self-normalized
  importance estimates of the PEPS density, with jackknife errors and
  effective sample sizes. Both density rows use viridis_r over 0..0.04;
  signed arrays are retained. TensorCircuit
  contractors, boundary-MPS contractions, backend transformations and
  TenCirPauli fermion operators are reused. Matrix-free CG and a thin-gauge
  dense reference are checked independently. Recorded settings, convergence
  comparisons, checkpoints and hardware measurements are documented in
  PEPS.md. The original paper's 12 x 12 PEPS accuracy and performance are
  not claimed. A 3 x 3 CPU demonstration remains available. Numerical
  comparisons use independent sector and Gaussian solutions, not author
  density arrays.
outputs:
  - target: "Figure 2(b,c) method: 6 x 6 PEPS-tVMC versus exact dynamics"
    path: "outputs/6x6/peps_6x6.png"
    script: "plot_peps_6x6.py"
  - target: "Figure 2(a): exact chiral edge-density propagation"
    path: "outputs/result.png"
    script: "main.py"
  - target: "Figure 2(b,c) method: small-system fermionic PEPS-tVMC"
    path: "outputs/peps_result.png"
    script: "run_peps.py"
